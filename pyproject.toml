[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vaults"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-frontmatter",
    "pyyaml",
    "lark",
    "pyarrow",
    "networkx",
    "rdflib",
]

[project.optional-dependencies]
dev    = ["pytest", "duckdb", "pandas", "numpy", "kuzu"]
pandas = ["pandas"]
polars = ["polars"]
dfs    = ["pandas", "polars"]
graph  = ["kuzu"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vaults*"]
