[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaults"
version = "0.1.0"
description = "Data analytics on human-curated structured and relational data in Markdown format, built around Obsidian."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-frontmatter",
    "pyyaml",
    "ruamel.yaml",
    "lark",
    "pyarrow",
    "networkx",
    "rdflib",
    "pandas",
]

[project.optional-dependencies]
polars = ["polars"]
db     = ["duckdb"]
kuzu   = ["kuzu"]
all    = ["polars", "duckdb", "kuzu"]
dev    = ["pytest", "polars", "duckdb", "kuzu"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vaults*"]
