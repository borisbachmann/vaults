[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vaults"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-frontmatter",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vaults*"]
